name: CI/CD

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      python-version: "3.15"
  compose-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create config and secret
        run: |
          cp .env.example .env
          mkdir -p secrets
          openssl rand -hex 16 | tr -d '\n' > secrets/db_password.txt

      - name: Start stack
        run: docker compose -f compose.yaml up -d --build --wait

      - name: Smoke tests through nginx
        run: |
          curl -fsS localhost:8080/health
          curl -fsS localhost:8080/ready
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"body":"ci"}' localhost:8080/notes
          curl -fsS localhost:8080/notes | grep -q '"ci"'
          curl -fsS localhost:8080/visits

      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml down -v

  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Deploy ${{ env.IMAGE }}:${{ github.sha }} to staging"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Deploy ${{ env.IMAGE }}:${{ github.sha }} to production"